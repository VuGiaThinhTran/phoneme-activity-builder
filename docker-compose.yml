services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Plaintext here is a deliberate, accepted simplification for
      # Assignment 2 (per the assessment clarification) — proper secrets
      # management via .env / encrypted credentials is covered later.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phoneme_builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phoneme_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/phoneme_builder?schema=public"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
